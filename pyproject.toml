[project]
name = "fastapi-installer"
version = "0.1.0"
description = "Generate production-ready FastAPI projects in seconds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.scripts]
fastapi-installer = "fastapi_installer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_installer"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/fastapi_installer/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
